<body class="min-h-screen flex flex-col py-6 px-4">
    <div class="custom-header">
        <div class="header-left" onclick="backToMenu()">
            <span class="text-3xl sm:text-4xl">🎓</span>
            <div class="text-left">
                <h1 class="text-xl sm:text-2xl font-black text-blue-600" style="margin:0; line-height:1.2;">Toán Trực Quan</h1>
                <p class="text-xs font-bold text-gray-400" style="margin:0;">Lớp 1 (Trọn Bộ HK1 & HK2)</p>
            </div>
        </div>
        <div class="header-right">
            <select id="theme-selector" onchange="changeTheme()" class="bg-indigo-100 text-indigo-700 font-black border-2 border-indigo-200 rounded-xl px-3 py-2 outline-none cursor-pointer text-sm">
                <option value="FRUIT">🍓 Hoa quả</option>
                <option value="POLICE">🚓 Cảnh sát</option>
                <option value="ANIMAL">🐶 Động vật</option>
            </select>
            <button id="btn-voice" onclick="toggleVoice()" class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-600 text-lg font-bold flex items-center justify-center border-0 cursor-pointer bounce-hover">🔊</button>
            <div class="bg-emerald-100 text-emerald-700 px-3 py-2 rounded-2xl font-black text-sm sm:text-base whitespace-nowrap">
                ⭐ Điểm: <span id="score-val">0</span>
            </div>
        </div>
    </div>

    <div class="max-w-5xl w-full mx-auto flex-grow bg-white rounded-[40px] shadow-xl p-6 border-4 border-yellow-300 relative flex flex-col">
        
        <div id="screen-menu" class="flex flex-col gap-8 w-full">
            <div class="text-center">
                <h2 class="text-3xl font-extrabold text-amber-500 mb-2">Bản Đồ Học Tập Lớp 1</h2>
                <p class="text-gray-500 font-bold">Hãy chọn bài học để bắt đầu nhé bé yêu!</p>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-blue-50 border-4 border-blue-200 rounded-3xl p-6">
                    <div class="flex justify-between items-center mb-4 border-b-2 border-blue-200 pb-2 cursor-pointer bounce-hover" onclick="toggleSemester('hk1')">
                        <h3 class="text-2xl font-black text-blue-600 m-0">Học Kỳ 1 (Phạm vi 10)</h3>
                        <span id="icon-hk1" class="text-xl bg-blue-200 text-blue-800 rounded-full w-8 h-8 flex items-center justify-center font-bold">🔽</span>
                    </div>
                    <div id="menu-hk1" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                </div>
                <div class="bg-green-50 border-4 border-green-200 rounded-3xl p-6">
                    <div class="flex justify-between items-center mb-4 border-b-2 border-green-200 pb-2 cursor-pointer bounce-hover" onclick="toggleSemester('hk2')">
                        <h3 class="text-2xl font-black text-green-600 m-0">Học Kỳ 2 (Phạm vi 100)</h3>
                        <span id="icon-hk2" class="text-xl bg-green-200 text-green-800 rounded-full w-8 h-8 flex items-center justify-center font-bold">🔽</span>
                    </div>
                    <div id="menu-hk2" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                </div>
            </div>
        </div>

        <div id="screen-intro" class="hidden flex flex-col h-full flex-grow items-center justify-center text-center gap-8">
            <h2 id="intro-title" class="text-4xl font-black text-amber-500">Phương pháp làm bài</h2>
            <div class="bg-amber-50 border-4 border-amber-200 rounded-3xl p-6 max-w-3xl shadow-inner relative w-full">
                <span class="absolute -top-6 -left-4 text-5xl">👩🏫</span>
                <button onclick="readMethod()" class="absolute -top-6 -right-4 w-12 h-12 rounded-full border-4 border-amber-200 bg-amber-100 text-xl font-bold bounce-hover shadow-md flex items-center justify-center" title="Đọc phương pháp">🔊</button>
                <div id="intro-content" class="text-xl font-bold text-amber-800 leading-relaxed text-left pt-2">
                    </div>
            </div>
            <button onclick="startGameAfterIntro()" class="px-8 py-4 bg-emerald-500 text-white rounded-full font-black text-2xl shadow-lg bounce-hover mt-4 w-full sm:w-auto">
                Đã hiểu! Bắt đầu 🚀
            </button>
        </div>

        <div id="screen-game" class="hidden flex flex-col h-full flex-grow">
            <div class="flex justify-between items-center pb-4 border-b-2 border-gray-100">
                <button onclick="backToMenu()" class="text-gray-500 font-bold hover:text-gray-800 text-base flex items-center gap-1 bg-transparent border-0 cursor-pointer">⬅️ Trở về</button>
                <h3 id="game-title" class="text-xl font-black text-blue-600 truncate max-w-[140px] sm:max-w-none">Đang học Toán</h3>
                <div class="flex gap-2">
                    <button onclick="showHint()" class="w-10 h-10 rounded-full bg-yellow-100 text-lg flex items-center justify-center shadow-sm border-0 cursor-pointer">💡</button>
                    <button onclick="speakPrompt()" class="w-10 h-10 rounded-full bg-blue-100 text-lg flex items-center justify-center shadow-sm border-0 cursor-pointer">🔊</button>
                </div>
            </div>

            <div id="speech-bubble" class="mt-4 bg-blue-50 border-2 border-blue-200 text-blue-800 rounded-2xl p-4 text-center text-xl font-bold">
                <span id="prompt-text">Câu hỏi hiển thị tại đây</span>
            </div>

            <div id="hint-box" class="hidden mt-4 bg-amber-50 border-2 border-amber-200 text-amber-800 rounded-2xl p-4 text-center text-base font-bold flex flex-col items-center gap-3">
                <div>💡 <span id="hint-text">Gợi ý hiển thị ở đây</span></div>
                <button onclick="speakHint()" class="px-4 py-2 bg-amber-200 text-amber-800 rounded-full shadow-sm font-bold flex items-center gap-1 border-0 cursor-pointer">🔊 Nghe đọc gợi ý</button>
            </div>

            <div id="workspace" class="my-6 flex justify-center items-center gap-4 flex-wrap w-full flex-grow min-h-[220px]"></div>

            <div id="controls" class="flex flex-col items-center gap-4 mt-auto">
                <div id="interactive-inputs" class="flex justify-center flex-wrap gap-4 w-full"></div>
                <button id="btn-next" onclick="loadNextRandomQuestion()" class="hidden px-8 py-4 bg-blue-500 text-white rounded-full font-black text-xl shadow-lg bounce-hover border-0 cursor-pointer">
                    Câu Tiếp Theo ➡️
                </button>
            </div>
        </div>
    </div>

    <script>
        // GLOBAL STATE
        let score = 0;
        let voiceEnabled = true;
        let currentLesson = null;
        let gameState = {};
        let currentHint = "";
        let audioUnlocked = false; 
        
        // THEMES
        let currentTheme = "FRUIT";
        const THEME_DATA = {
            "FRUIT": ["🍎", "🍓", "🍌", "🍉", "🍇"],
            "POLICE": ["👮♂️", "🚓", "🚁", "🚨", "🛡️"],
            "ANIMAL": ["🐶", "🐱", "🐰", "🦊", "🦁"]
        };
        
        function changeTheme() {
            currentTheme = document.getElementById("theme-selector").value;
            if (currentLesson && currentLesson.type === "COUNTING" && !currentLesson.useBundles) {
                loadNextRandomQuestion();
            }
        }

        // CURRICULUM DATABASE
        const CURRICULUM = [
            { id: "hk1_1", semester: 1, type: "COUNTING", title: "Bé Tập Đếm", icon: "🍓", desc: "Đếm số vật phẩm từ 1 đến 10", maxRange: 10, items: ["🍎", "🍓", "🍌", "🚙", "🎈"],
              method: "Khi đếm, bé hãy dùng ngón tay trỏ vào từng vật và đọc to số thứ tự: 1, 2, 3... Đếm đến vật cuối cùng thì đó chính là tổng số lượng!" },
            { id: "hk1_2", semester: 1, type: "COMPARISON", title: "So Sánh Lớn Bé", icon: "⚖️", desc: "Điền dấu >, <, = (phạm vi 10)", maxRange: 10,
              method: "Bé hãy ghi nhớ tên các dấu nhé:<br/>- Dấu <b>></b> gọi là dấu <b>LỚN HƠN</b><br/>- Dấu <b>&lt;</b> gọi là dấu <b>BÉ HƠN</b><br/>- Dấu <b>=</b> gọi là dấu <b>BẰNG NHAU</b><br/><br/>💡 Dấu > và &lt; giống cái miệng con cá sấu. Cá sấu luôn luôn <b>HÁ TO MIỆNG</b> về phía con số to hơn!" },
            { id: "hk1_3a", semester: 1, type: "ADDITION", pattern: [0, 1], title: "Cộng Cơ Bản (A+B)", icon: "➕", desc: "Tìm tổng của 2 số", maxRange: 10,
              method: "Phép CỘNG nghĩa là GỘP LẠI.<br/><br/>Bé xòe ngón tay ứng với số lớn hơn, rồi đếm nhẩm thêm ngón tay ứng với số nhỏ hơn nhé!" },
            { id: "hk1_3b", semester: 1, type: "ADDITION", pattern: [2, 3], title: "Tìm Số Hạng (A+?=C)", icon: "🧩", desc: "Tìm phần bị khuyết", maxRange: 10,
              method: "Tìm phần bị thiếu trong phép cộng:<br/><br/>Bé đếm tiếp từ số đã biết cho đến khi đạt được số tổng xem là phải thêm mấy ngón tay nhé!" },
            { id: "hk1_3c", semester: 1, type: "ADDITION", pattern: [4], title: "Đẳng Thức (?=A+B)", icon: "⚖️", desc: "Dấu bằng đứng trước", maxRange: 10,
              method: "Dấu bằng nằm ở bên trái cũng không sao! Bé cứ tính bình thường xem A + B bằng mấy rồi điền vào dấu hỏi chấm nhé." },
            { id: "hk1_4a", semester: 1, type: "SUBTRACTION", pattern: [0], title: "Trừ Cơ Bản (A-B)", icon: "➖", desc: "Tìm hiệu của 2 số", maxRange: 10,
              method: "Phép TRỪ nghĩa là BỚT ĐI.<br/><br/>Bé xòe số ngón tay ứng với số bị trừ, rồi gập đi số ngón tay cần trừ. Đếm xem còn lại mấy ngón đang xòe nhé!" },
            { id: "hk1_4b", semester: 1, type: "SUBTRACTION", pattern: [1, 2], title: "Tìm Số Khuyết (A-?=C)", icon: "🧩", desc: "Tìm số trừ/bị trừ", maxRange: 10,
              method: "Bài toán khuyết phép trừ:<br/><br/>- Nếu thiếu số ở giữa (A - ? = C): Bé lấy A trừ đi C.<br/>- Nếu thiếu số ở đầu (? - B = C): Bé lấy C cộng lại với B để tìm ra số ban đầu nhé!" },
            { id: "hk1_5", semester: 1, type: "SHAPES", title: "Hình Học", icon: "🔺", desc: "Nhận biết vuông, tròn, tam giác...",
              method: "Bé hãy quan sát đặc điểm:<br/><br/>- <b>Hình vuông</b> có 4 cạnh dài bằng nhau.<br/>- <b>Hình chữ nhật</b> cũng có 4 cạnh nhưng dài hơn hình vuông.<br/>- <b>Hình tròn</b> cong đều và lăn được.<br/>- <b>Hình tam giác</b> có 3 đỉnh nhọn!" },
            { id: "hk1_6", semester: 1, type: "ADVANCED_CHAIN", title: "Toán Chuỗi (Đến 10)", icon: "🚂", desc: "Cộng trừ liên tiếp 3 số", maxRange: 10,
              method: "Bé hãy tính từ trái sang phải nhé. Lấy số thứ nhất cộng hoặc trừ số thứ hai được bao nhiêu, bé tiếp tục tính với số thứ ba!" },
            { id: "hk1_7", semester: 1, type: "ADVANCED_BALANCE", title: "So Sánh Biểu Thức", icon: "⚖️", desc: "So sánh (A+B) và (C+D)", maxRange: 10,
              method: "Bé tính xem phép tính bên trái bằng mấy, phép tính bên phải bằng mấy. Sau đó so sánh hai kết quả đó với nhau rồi mới điền dấu lớn, bé, bằng nhé!" },
            { id: "hk2_1", semester: 2, type: "COUNTING", title: "Đếm Đến 100", icon: "🔢", desc: "Nhận biết hàng chục và đơn vị", maxRange: 99, useBundles: true,
              method: "Với số lượng lớn, người ta thường buộc lại thành từng BÓ CHỤC (1 bó = 10 que).<br/><br/>Bé hãy đếm số bó chục trước (10, 20, 30...), rồi đếm tiếp các que lẻ ở bên ngoài nhé!" },
            { id: "hk2_2", semester: 2, type: "COMPARISON", title: "So Sánh Đến 100", icon: "⚖️", desc: "So sánh 2 số lớn (>, <, =)", maxRange: 99,

        // SPEECH ENGINE 
        function speak(text) {
            if (!voiceEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 

                let plainText = text.replace(/<br\/>/g, '. ').replace(/<\/?b>/g, '').replace(/<\/?i>/g, '').replace(/&lt;/g, 'nhỏ hơn').replace(/&gt;/g, 'lớn hơn');
                let utterance = new SpeechSynthesisUtterance(plainText);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.92; 
                utterance.pitch = 1.05;

                let voices = window.speechSynthesis.getVoices();
                let viVoice = voices.find(v => v.lang === 'vi-VN' || v.lang.startsWith('vi'));
                if (viVoice) {
                    utterance.voice = viVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        function unlockIOSAudio() {
            if (audioUnlocked) return;
            if ('speechSynthesis' in window) {
                let u = new SpeechSynthesisUtterance('');
                u.volume = 0;
                window.speechSynthesis.speak(u);
                audioUnlocked = true;
            }
        }

        function readMethod() {
            if (!currentLesson) return;
            unlockIOSAudio();
            speak("Phương pháp làm bài. " + currentLesson.method);
        }

        // ĐÃ SỬA: Xóa hàm tự động đọc (readMethod) để yên tĩnh khi chọn bài
        function startLesson(id) {
            currentLesson = CURRICULUM.find(l => l.id === id);
            document.getElementById("screen-menu").classList.add("hidden");
            document.getElementById("screen-intro").classList.remove("hidden");
            document.getElementById("intro-title").innerText = currentLesson.title;
            document.getElementById("intro-content").innerHTML = currentLesson.method;
            
            // Xóa readMethod() ở đây
        }

        function startGameAfterIntro() {
            unlockIOSAudio();
            document.getElementById("screen-intro").classList.add("hidden");
            document.getElementById("screen-game").classList.remove("hidden");
            document.getElementById("game-title").innerText = currentLesson.title;
            loadNextRandomQuestion();
        }

        function backToMenu() {
            document.getElementById("screen-intro").classList.add("hidden");
            document.getElementById("screen-menu").classList.remove("hidden");
            document.getElementById("screen-game").classList.add("hidden");
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // ĐÃ SỬA: Xóa hàm tự động đọc (speakPrompt) khi qua câu mới
        function loadNextRandomQuestion() {
            document.getElementById("btn-next").classList.add("hidden");
            document.getElementById("hint-box").classList.add("hidden"); 
            const workspace = document.getElementById("workspace");
            const inputs = document.getElementById("interactive-inputs");
            workspace.innerHTML = ""; inputs.innerHTML = "";
            gameState = {};
            currentHint = "";

            switch (currentLesson.type) {
                case "COUNTING": renderCounting(); break;
                case "COMPARISON": renderComparison(); break;
                case "ADDITION": renderAddition(); break;
                case "SUBTRACTION": renderSubtraction(); break;
                case "SHAPES": renderShapes(); break;
                case "TIME": renderTime(); break;
                case "ADVANCED_CHAIN": renderAdvancedChain(); break;
                case "ADVANCED_BALANCE": renderAdvancedBalance(); break;
            }
            
            // Xóa speakPrompt() ở đây
        }

        // GAME ENGINES
        function renderCounting() {
            let count = 0;
            if (currentLesson.useBundles) {
                count = Math.floor(Math.random() * 80) + 10; 
                const tens = Math.floor(count / 10);
                const ones = count % 10;
                document.getElementById("prompt-text").innerText = `Có bao nhiêu que tính ở đây hả bé?`;
                
                let html = `<div class="flex flex-wrap gap-4 justify-center w-full">`;
                for(let i=0; i<tens; i++) html += `<div class="text-3xl border-4 border-red-500 p-2 rounded-xl bg-red-50 font-bold" title="1 Chục">🥢x10</div>`;
                if(ones > 0) {
                    html += `<div class="flex gap-1 flex-wrap items-center">`;
                    for(let i=0; i<ones; i++) html += `<div class="text-3xl">🥢</div>`;
                    html += `</div>`;
                }
                html += `</div>`;
                document.getElementById("workspace").innerHTML = html;
                currentHint = `Bé đếm số bó chục trước: 10, 20... rồi cộng thêm các que rời nhé!`;
            } else {
                count = Math.floor(Math.random() * (currentLesson.maxRange - 1)) + 2;
                const activeItems = THEME_DATA[currentTheme];
                const icon = activeItems[Math.floor(Math.random() * activeItems.length)];
                document.getElementById("prompt-text").innerText = `Bé hãy đếm xem có tất cả bao nhiêu hình ${icon} nhé!`;
                let html = `<div class="flex flex-wrap justify-center gap-4 max-w-xl">`;
                for(let i=0; i<count; i++) html += `<span class="text-5xl pulse-active cursor-pointer" onclick="playSfx('success')">${icon}</span>`;
                html += `</div>`;
                document.getElementById("workspace").innerHTML = html;
                currentHint = `Bé dùng ngón tay chỉ vào từng hình để đếm từ 1 đến hết, không đếm lặp lại nhé!`;
            }
            generateOptions(count, currentLesson.maxRange);
        }

        function renderComparison() {
            const a = Math.floor(Math.random() * currentLesson.maxRange);
            let b = Math.floor(Math.random() * currentLesson.maxRange);
            while (currentLesson.maxRange < 20 && a === b) b = Math.floor(Math.random() * currentLesson.maxRange);
            
            let answer = a > b ? ">" : (a < b ? "<" : "=");
            document.getElementById("prompt-text").innerText = `Bé hãy điền dấu thích hợp vào chỗ trống nhé!`;
            
            document.getElementById("workspace").innerHTML = `
                <div class="flex items-center gap-6 bg-purple-50 p-6 rounded-3xl border-4 border-purple-200">
                    <span class="text-5xl font-black text-blue-600">${a}</span>
                    <div id="drop-zone" class="w-16 h-16 border-4 border-dashed border-gray-400 rounded-2xl flex items-center justify-center text-4xl font-black text-gray-300">?</div>
                    <span class="text-5xl font-black text-red-600">${b}</span>
                </div>
            `;
            
            currentHint = `Cá sấu luôn muốn ăn số lượng nhiều hơn nên nó luôn há to miệng về phía số lớn hơn đó bé!`;
            
            const inputs = document.getElementById("interactive-inputs");
            [">", "=", "<"].forEach(sign => {
                const btn = document.createElement("button");

                btn.innerText = sign;
                btn.onclick = () => submitAnswer(sign, answer, btn);
                inputs.appendChild(btn);
            });
        }

        function renderAddition() {
            let a, b;
            if (currentLesson.maxRange <= 10) {
                a = Math.floor(Math.random() * 8) + 1;
                b = Math.floor(Math.random() * (10 - a)) + 1;
            } else {
                a = Math.floor(Math.random() * 80) + 10;
                let maxBOnes = 9 - (a % 10);
                b = Math.floor(Math.random() * 8) * 10 + Math.floor(Math.random() * maxBOnes);
            }
            const c = a + b;
            
            const pattern = currentLesson.pattern ? currentLesson.pattern[Math.floor(Math.random() * currentLesson.pattern.length)] : 0;
            let equationHtml = "";
            let correctAnswer = 0;
            const qSpan = `<span class="text-rose-500 w-12 text-center inline-block border-b-4 border-rose-500 pb-1">?</span>`;
            
            if (pattern === 0 || pattern === 1) {
                equationHtml = `<span>${a}</span> <span class="text-green-500">+</span> <span>${b}</span> <span class="text-gray-400">=</span> ${qSpan}`;
                correctAnswer = c;
            } else {
                equationHtml = `<span>${a}</span> <span class="text-green-500">+</span> ${qSpan} <span class="text-gray-400">=</span> <span>${c}</span>`;
                correctAnswer = b;
            }

            document.getElementById("prompt-text").innerText = `Bé hãy tìm số thích hợp điền vào dấu hỏi chấm nhé!`;
            document.getElementById("workspace").innerHTML = `<div class="flex items-center justify-center gap-4 text-4xl font-black text-slate-700 w-full">${equationHtml}</div>`;
            currentHint = `Phép cộng có nghĩa là gộp lại, bé hãy sử dụng ngón tay hoặc phép tính trừ ngược lại nhé!`;
            generateOptions(correctAnswer, currentLesson.maxRange);
        }

        function renderSubtraction() {
            let a, b;
            if (currentLesson.maxRange <= 10) {
                a = Math.floor(Math.random() * 8) + 2; 
                b = Math.floor(Math.random() * (a - 1)) + 1; 
            } else {
                a = Math.floor(Math.random() * 80) + 20;
                let aOnes = a % 10;
                b = Math.floor(Math.random() * Math.floor(a/10)) * 10 + Math.floor(Math.random() * aOnes);
                if(b===0) b = 1;
            }
            const c = a - b;
            let correctAnswer = c;
            
            document.getElementById("prompt-text").innerText = `Bé hãy tìm số thích hợp điền vào dấu hỏi chấm nhé!`;
            document.getElementById("workspace").innerHTML = `<div class="flex items-center justify-center gap-4 text-4xl font-black text-slate-700 w-full"><span>${a}</span> <span class="text-red-500">-</span> <span>${b}</span> <span class="text-gray-400">=</span> <span class="text-rose-500 w-12 text-center border-b-4 border-rose-500">?</span></div>`;
            currentHint = `Bé hãy xòe ngón tay ra rồi gập bớt đi xem còn lại bao nhiêu nhé!`;
            generateOptions(correctAnswer, currentLesson.maxRange);
        }

        function renderAdvancedBalance() {

            let b = Math.floor(Math.random() * 5) + 1;

                </div>

                btn.innerText = sign;
                btn.onclick = () => submitAnswer(sign, answer, btn);

        // CONTROL HELPER
        function generateOptions(correctAnswer, maxLimit, suffix = "") {
            const inputs = document.getElementById("interactive-inputs");
            let options = new Set([correctAnswer]);
            while (options.size < 4) {
                let diff = Math.floor(Math.random() * 9) - 4; 
                let r = correctAnswer + diff;
                if (r >= 0 && r !== correctAnswer && r <= maxLimit * 1.5) options.add(r);
            }
            Array.from(options).sort((a,b) => a-b).forEach(num => {
                const btn = document.createElement("button");
                btn.className = "px-4 py-3 min-w-[70px] bg-yellow-100 border-4 border-yellow-400 text-2xl font-black text-amber-700 rounded-2xl bounce-hover shadow-sm flex items-center justify-center cursor-pointer";
                btn.innerText = num + suffix;
                btn.onclick = () => {
                    unlockIOSAudio();
                    submitAnswer(num, correctAnswer, btn);
                };
                inputs.appendChild(btn);
            });
        }

        // GIỮ LẠI LỆNH ĐỌC KHI BÉ TRẢ LỜI ĐÚNG / SAI
        function submitAnswer(user, correct, btnEl) {
            const btns = document.getElementById("interactive-inputs").querySelectorAll("button");
            btns.forEach(b => b.disabled = true);
            
            if (user === correct) {
                btnEl.classList.add("bg-green-500", "text-white", "border-green-600");
                playSfx('success');
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 60, origin: { y: 0.7 } });
                }
                score += 10;
                document.getElementById("score-val").innerText = score;
                document.getElementById("prompt-text").innerText = `🎉 Bé giỏi quá! Đáp án chính xác là ${correct}!`;
                
                // MÁY ĐỌC KHEN NGỢI
                speak(`Giỏi quá! Bé yêu xuất sắc lắm!`);
                
                document.getElementById("btn-next").classList.remove("hidden");
            } else {
                btnEl.classList.add("bg-red-500", "text-white", "border-red-600");
                playSfx('fail');
                document.getElementById("prompt-text").innerText = `Chưa đúng rồi. Bé thử lại xem sao nhé!`;
                
                // MÁY ĐỌC ĐỘNG VIÊN
                speak(`Chưa đúng rồi, thử lại nha bé yêu!`);
                
                setTimeout(() => {
                    btnEl.classList.remove("bg-red-500", "text-white", "border-red-600");
                    btns.forEach(b => b.disabled = false);
                }, 1000);
            }
        }

            const hintBox = document.getElementById("hint-box");
            document.getElementById("hint-text").innerText = currentHint;

        function toggleVoice() {
            unlockIOSAudio();
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById("btn-voice");
            if (voiceEnabled) {
                btn.innerText = "🔊";
                speak("Đã bật âm thanh");
            } else {
                btn.innerText = "🔇";
            }
        }
        
        function playSfx(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'success') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(130, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) {
                console.log("AudioContext blocked");
            }
        }

        window.addEventListener('load', () => {
            renderMenu();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = window.speechSynthesis.getVoices;
                }
            }
        });

        window.addEventListener('click', unlockIOSAudio, { passive: true });
        window.addEventListener('touchstart', unlockIOSAudio, { passive: true });
    </script>
</body>
</html>
